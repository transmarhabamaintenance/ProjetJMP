services:
  backend:
    build: ./backend
    container_name: jmp-backend
    environment:
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: jmp
      MYSQL_PASSWORD: jmp
      MYSQL_DATABASE: jmp
      JWT_SECRET: ${JWT_SECRET:-changer-ce-secret}
      JMP_ADMIN_USERNAME: ${JMP_ADMIN_USERNAME:-admin}
      JMP_ADMIN_PASSWORD: ${JMP_ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # Toute route API répond 401 sans jeton : on vérifie donc seulement que le port écoute.
      test: ["CMD-SHELL", "node -e \"require('net').connect(8080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # Non publié sur l'hôte : un MySQL local sur 3306 resterait utilisable en parallèle.
  mysql:
    image: mysql:8.4
    container_name: jmp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: jmp
      MYSQL_USER: jmp
      MYSQL_PASSWORD: jmp
      MYSQL_DATABASE: jmp
    volumes:
      - jmp-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ujmp", "-pjmp"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: jmp-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  jmp-data:
